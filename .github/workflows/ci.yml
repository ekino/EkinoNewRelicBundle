name: CI

on:
  pull_request: ~
  push:
    branches:
      - master

jobs:
  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-CS-Fixer
        uses: docker://oskarstark/php-cs-fixer-ga

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        composer: ['']
        symfony: ['']
        deprecation: ['']
        include:
          - php: 8.3
            composer: --prefer-stable --prefer-lowest
            deprecation: max[direct]=0
          - php: 8.3
            symfony: '^6.4'
          - php: 8.3
            symfony: '^7.0'

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: flex

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deprecation
        if: matrix.deprecation != ''
        run: echo 'SYMFONY_DEPRECATIONS_HELPER=${{ matrix.deprecation }}' >> $GITHUB_ENV

      - name: Setup symfony
        if: matrix.symfony != ''
        run: |
          echo 'SYMFONY_REQUIRE=${{ matrix.symfony }}' >> $GITHUB_ENV

      - name: Download dependencies
        run: |
          composer update ${{ matrix.composer }} --prefer-dist --no-interaction
          ./vendor/bin/simple-phpunit install

      - name: Validate
        run: |
          composer validate --strict --no-check-lock

      - name: Run tests
        env:
          SYMFONY_PHPUNIT_REMOVE_RETURN_TYPEHINT: 1
        run: |
          ./vendor/bin/simple-phpunit